name: Daily Nordex orders

on:
  schedule:
    - cron: "17 5 * * *"   # every day ~06:17 CET
  workflow_dispatch:
    inputs:
      max_llm_calls:
        description: "Max LLM calls this run (60 fits the free daily token budget)"
        default: "60"
      reextract:
        description: "Re-parse ALL cached releases (only after changing the prompt)"
        type: boolean
        default: false

permissions:
  contents: write   # commit refreshed (encrypted) data
  pages: write
  id-token: write

concurrency:
  group: nordex-orders
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, extract, build
        env:
          # LLM: Groq free tier by default. Secret LLM_API_KEY = your Groq API key (console.groq.com).
          # Optional repo variables LLM_BASE_URL / LLM_MODEL switch to any OpenAI-compatible provider.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_PAUSE_S: ${{ vars.LLM_PAUSE_S }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM || '2024-01-01' }}
          MAX_LLM_CALLS: ${{ inputs.max_llm_calls || '60' }}
          # Public repo: all data is encrypted with this password; the run refuses to start without it
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          REQUIRE_PASSWORD: "true"
        run: |
          python scraper/run.py ${{ inputs.reextract && '--reextract' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data   # .gitignore keeps the plaintext files out; only *.enc files are committed
          if git diff --cached --name-only | grep -E '^(data/releases/.*\.json|docs/data/deals\.(json|csv))$'; then
            echo "Plaintext data staged, aborting"; exit 1
          fi
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push

      - name: Guard - only encrypted data goes to the website
        run: test ! -e docs/data/deals.json && test ! -e docs/data/deals.csv && test -e docs/data/deals.enc.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
